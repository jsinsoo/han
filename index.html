<!DOCTYPE html>

<html lang="ko"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>고전 한문 자료 모바일 앱</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Malgun Gothic', sans-serif;
    background:#f5f5f5;
    overflow:hidden;
}

.topbar{
    width:100%;
    background:#111827;
    color:white;
    padding:12px;
    overflow-x:auto;
    white-space:nowrap;
    display:flex;
    gap:10px;
    align-items:center;
}

.topbar label{
    display:inline-block;
}

.topbar input[type=radio]{
    display:none;
}

.topbar span{
    display:inline-block;
    padding:10px 18px;
    border-radius:25px;
    background:#374151;
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-size:15px;
}

.topbar input[type=radio]:checked + span{
    background:#2563eb;
    color:white;
    font-weight:bold;
}

.viewer{
    width:100%;
    height:calc(100vh - 70px);
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}
</style>

<script>
function loadPage(page){
    document.getElementById('viewerFrame').src = page;
}
</script>

</head>
<body>

<div class="topbar">

<label>
<input type="radio" name="menu" checked="" onclick="loadPage(&#39;00.html&#39;)">
<span>명심보감</span>
</label>

<label>
<input type="radio" name="menu" onclick="loadPage(&#39;01.html&#39;)">
<span>논어</span>
</label>

<label>
<input type="radio" name="menu" onclick="loadPage(&#39;02.html&#39;)">
<span>맹자</span>
</label>

<label>
<input type="radio" name="menu" onclick="loadPage(&#39;03.html&#39;)">
<span>중용</span>
</label>

<label>
<input type="radio" name="menu" onclick="loadPage(&#39;04.html&#39;)">
<span>대학</span>
</label>

<label>
<input type="radio" name="menu" onclick="loadPage(&#39;05.html&#39;)">
<span>시경</span>
</label>

<label>
<input type="radio" name="menu" onclick="loadPage(&#39;06.html&#39;)">
<span>서경</span>
</label>

<label>
<input type="radio" name="menu" onclick="loadPage(&#39;07.html&#39;)">
<span>주역64괘</span>
</label>

</div>

<div class="viewer">
<iframe id="viewerFrame" src="00.html"></iframe>
</div>
